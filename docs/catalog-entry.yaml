name: butler
repo: https://github.com/Intenzi/hermes-butler
sha: "REPLACE_WITH_FULL_40_HEX_SHA_OF_THE_PINNED_COMMIT"
version: "0.3.0"
title: Butler
description: "Supercharges the Hermes desktop pet into an on-screen operator. WALK plans a follow-mode guide from Accessibility facts, draws a ring on the control and verifies each step rather than describing it — the pet stays on the step until the OS confirms it. LOOK turns the pointer into the referent: drag the hat (or pick from its menu) and the next click lands on the plugin's overlay, never on the app, so any control can be read — role, label, enabled state, value — and asked about without leaving the window. WATCH reads one app's Accessibility tree in the background and announces a condition once, leaving the line on the pet until it is acknowledged. Everything runs on Accessibility only: no screenshots, no OCR, no Screen Recording, no Input Monitoring. The screen helper is Swift, built by this repository's GitHub Actions workflow, attested, and fetched at first use with its SHA-256 verified; it compiles locally only as a fallback."
maintainer: Intenzi
tier: community
category: desktop
requires_hermes: ">=0.22.5"
docs_url: https://github.com/Intenzi/hermes-butler/blob/main/README.md
readme: true
platforms: [macos]
capabilities:
  provides_tools:
    - butler_capture
    - butler_guide_start
    - butler_guide_status
    - butler_look
    - butler_say
    - butler_stop
    - butler_watch_ack
    - butler_watch_start
    - butler_watch_status
    - butler_watch_stop
  provides_hooks: []
  provides_middleware: []
  requires_env: []
known_issues:
  - "macOS only: the companion is a native Swift helper, and every feature that reads the screen needs the Accessibility grant."
  - "Guides are single-active: a second guide is refused with a hint unless replace=true."
  - "WATCH runs one app at a time; Chromium/Electron trees need the window to have been opened once before their controls are visible."
  - "LOOK's click-catcher covers the screen while armed, so clicks do not reach other apps until you cancel or pick."
