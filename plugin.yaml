name: butler
version: 0.4.1
description: >
  Butler — a Follow-mode guide for Hermes: the agent plans, the butler walks
  your screen step by step (ring on the real control, one-line bubbles, live
  progress), verifying each step from the macOS Accessibility layer. macOS only
  in v0.2; capture and overlay are swappable modules for later platforms.
requires_hermes: ">=0.22.5"
api: plugin_api.py
provides_tools:
  - butler_guide_start
  - butler_guide_status
  - butler_capture
  - butler_look
  - butler_say
  - butler_stop
  - butler_watch_start
  - butler_watch_status
  - butler_watch_stop
  - butler_watch_ack
provides_hooks: []
config_schema:
  poll_seconds:
    type: number
    default: 1.5
    description: How often the guide re-captures the screen while waiting on a step; read from plugin-data/butler/config.json.
  step_timeout_seconds:
    type: number
    default: 120
    description: How long a step stays open before the butler reports a stall; read from plugin-data/butler/config.json.
  stall_auto_stop_seconds:
    type: number
    default: 180
    description: How long a stalled guide may sit before it stops itself; read from plugin-data/butler/config.json.
python_dependencies:
  - "pyobjc-core>=10.3,<12"
  - "pyobjc>=10.3,<12; platform_system=='Darwin'"
